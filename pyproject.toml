[project]
name = "codegen"
version = "0.1.0"
description = "GEPA x GRPO for first-attempt code generation (Qwen3-4B on APPS)"
requires-python = ">=3.10"
dependencies = ["ijson>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
